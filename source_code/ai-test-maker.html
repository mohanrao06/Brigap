<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Skill Assessment — Brigap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div class="brand">Bri<span>gap</span></div>
    <span id="quiz-domain-badge" style="font-size:14px;color:#8ff5ec;font-weight:600;"></span>
  </header>

  <main class="page" style="max-width:820px;margin:0 auto;padding:44px 20px;">
    <h1 style="font-size:34px;line-height:1.2;margin-bottom:10px;">AI Domain Skill Benchmark</h1>
    <p id="quiz-subtitle" style="font-size:16px;opacity:0.88;margin-bottom:24px;">
      30 MCQs generated dynamically for your chosen domain. Score above 15 for Intermediate &amp; Advanced courses, or above 20 for Advanced courses.
    </p>

    <!-- Gemini API Key Setup Box (Saved in localStorage so you don't expose keys in Git) -->
    <div style="padding:18px 20px;border-radius:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(143,245,236,0.3);margin-bottom:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;">
      <input id="gemini-key-input" type="password" placeholder="Paste Gemini API Key (AIza...) to generate 30 domain MCQs"
        style="flex:1;min-width:260px;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);background:#073652;color:white;font-family:inherit;font-size:14px;outline:none;">
      <button type="button" id="generate-quiz-btn" class="button"
        style="margin-top:0;padding:12px 22px;border-radius:12px;border:none;cursor:pointer;font-size:14px;">
        Generate 30 AI Questions
      </button>
    </div>

    <div id="quiz-status" style="font-size:15px;color:#8ff5ec;margin-bottom:18px;"></div>
    <form id="quiz-form" style="text-align:left;display:grid;gap:18px;"></form>

    <div style="margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <button type="button" id="submit-quiz-btn" class="button" style="display:none;margin-top:0;border:none;cursor:pointer;">
        Submit 30 Answers &amp; View Recommended Courses →
      </button>
      <a class="button" style="margin-top:0;background:rgba(255,255,255,0.14);" href="index.html">← Back to Dashboard</a>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>

</html>
